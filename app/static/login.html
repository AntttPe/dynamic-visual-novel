<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Logowanie</title>
  <style>
    :root { --bg: #0f1217; --surface: #171b22; --ink: #e6eaf0; --muted: #9aa4b1; --line: #2a313b;
            --gold: #e3b26b; --gold-ink: #1a1208; --bad: #f0766b; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line);
           border-radius: 12px; padding: 28px 24px; display: grid; gap: 14px; }
    h1 { margin: 0; font: 600 26px/1.2 "Palatino Linotype", Palatino, Georgia, serif; color: var(--gold); }
    p { margin: 0; color: var(--muted); }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--bg); color: var(--ink); }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px;
             background: var(--gold); color: var(--gold-ink); cursor: pointer; }
    .error { color: var(--bad); }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Dynamic Visual Novel</h1>
    <p>Podaj hasło, żeby zagrać.</p>
    {{error}}
    <label>Hasło
      <input type="password" name="password" autocomplete="current-password" autofocus required />
    </label>
    <button type="submit">Wejdź</button>
  </form>
</body>
</html>
